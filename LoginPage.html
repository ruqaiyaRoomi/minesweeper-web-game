<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>MineSweeper</title>
	<link rel="stylesheet" href="/css/minesweeper.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<body>

    <header>
	<a href="index.html" id="game_title"><h1>Minesweeper</h1></a>
	<nav>
		<ul id="navigation_bar">
			<li><a href="index.html">Home</a></li>
			<li><a href="Rules.html">Rules</a></li>
			<li id="Lboard"><a href="Leaderboard.html">Leaderboard</a></li>
		</ul>
	</nav>
	<button style="background-color: transparent; border: none;" onclick="signout()">
		<i class="fa-solid fa-arrow-right-from-bracket" onclick="signout()"></i></button>			
	<a href="LoginPage.html"><button id="sign_in">Sign in</button></a>
	</header>
	
	<div class="container">
		<div class="loginBox Login">
		<h1>Login</h1>
			<form onsubmit="login()">
				<div class="user_input" id="username">
                    <input type="text" required>
                    <label>username</label>
                    <i class="fa-regular fa-user"></i>
					
                </div>
				<div class="user_input">
                    <input type="email" id="user_email"  required>
                    <label>email</label>
                    <i class="fa-regular fa-envelope"></i>
                </div>
				<div class="user_input">
                    <input type="password" required id="userPassword">
                    <label>Password</label>
                    <i class="fa-regular fa-eye-slash"></i>
                    <p id="messages"></p>
				</div>
				<a href="game.html"><button id="loginButton" onclick="login()">Login</button></a>
				<div id="register_link">
				<a href="SignupPage.html">Don't have an account? Sign Up!</a>
				</div>
			</form>
		</div>	
	</div>

	<script src="/JavaScript/loginpage.js"></script>
	
</body>
</html>
