<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>MineSweeper</title>
	<link rel="stylesheet" href="/css/minesweeper.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
		<a href="index.html" id="game_title"><h1>Minesweeper</h1></a>
		<nav>
		<ul id="navigation_bar">
		<li><a href="index.html">Home</a></li>
		<li><a href="Rules.html">Rules</a></li>
		<li id="Lboard"><a href="Leaderboard.html">Leaderboard</a></li>
		</ul>
		</nav>
		<button style="background-color: transparent; border: none;" onclick="signout()">
			<i class="fa-solid fa-arrow-right-from-bracket"></i></button>			
		<a href="LoginPage.html"><button id="sign_in">Sign in</button></a>
	</header>
	<!-- leaderboard to display the top 10 scores-->
	<h1 id="heading_leaderboard">Leaderboard</h1>
	<table>
		<tr>
			<th style="width:90px">Rank</th>
			<th>Username</th>
			<th><select id="level"> <!-- using a selector to display the scores based on level diffculty-->
				<option value="Easy">Easy</option>
				<option value="Medium">Medium</option>
				<option value="Hard">Hard</option>
			</select></th>
			<th>Time</th>	
			
		</tr>
		<tbody id="leaderboardBody">
		</tbody>
	</table>
	<a href="game.html"><button id="playAgain">Play Again</button></a>
	<script src="/JavaScript/LeaderBoard.js"></script>
	<footer></footer>
</body>
</html>
